name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cpp/**'
      - 'tests/**'
      - 'eval/**'
      - 'conftest.py'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake g++ pkg-config libcurl4-openssl-dev libjsoncpp-dev \
            libpoppler-cpp-dev libsqlite3-dev

      - name: Build C++ server
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --parallel 2

      # The suite stubs the network and the LLM, so no API key is needed and a
      # run costs nothing. A missing secret must not turn into a red build.
      - name: Run tests
        run: python -m pytest -q
