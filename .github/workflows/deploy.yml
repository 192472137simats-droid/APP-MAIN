name: Deploy to Railway

# Auto-deploys the app to Railway on every push to main.
# Requires one repo secret: RAILWAY_TOKEN
#   Railway → Account/Workspace → Tokens → create a token (workspace:
#   "abhiram7462's Projects"), then add it here under
#   Settings → Secrets and variables → Actions → New repository secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          # Workspace/account token goes in RAILWAY_API_TOKEN; the explicit
          # --project/--environment/--service flags below target this app.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set yet — add it in Settings → Secrets and variables → Actions, then re-run. Skipping deploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway up \
            --ci \
            --service web \
            --environment production \
            --project f2c7ee43-5f8b-4502-a867-ef6b647e9460
