name: Deploy to Railway

# Auto-deploys the app to Railway on every push to main.
# Requires one repo secret: RAILWAY_TOKEN  (a Railway PROJECT token —
#   project research-advisor-lm → Settings → Tokens → environment: production).
# The step below tries project-token auth first, then account/workspace-token
# auth, so either kind of Railway token works.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_SECRET: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_SECRET" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set yet — add it in Settings → Secrets and variables → Actions, then re-run. Skipping deploy."
            exit 0
          fi
          npm install -g @railway/cli
          PROJECT=f2c7ee43-5f8b-4502-a867-ef6b647e9460
          echo "Attempt 1: project-token auth (RAILWAY_TOKEN)"
          if RAILWAY_TOKEN="$RAILWAY_SECRET" railway up --ci --service web --environment production --project "$PROJECT"; then
            echo "Deployed."
            exit 0
          fi
          echo "Attempt 1 failed — Attempt 2: account/workspace-token auth (RAILWAY_API_TOKEN)"
          RAILWAY_API_TOKEN="$RAILWAY_SECRET" railway up --ci --service web --environment production --project "$PROJECT"
